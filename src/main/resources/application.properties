# ===========================================
# Appointment Booking System - General Purpose
# ===========================================
# Use this system for any business: clinics, salons, consultants, tutors, etc.
# Customize the values below to match your organization (name, hours, service types).
# ===========================================

# Application name and branding (change to your business name)
app.name=Appointment Booking System
app.version=3.0.0
app.showDevCredentials=false
app.brand.name=Appointment Booking System
app.brand.tagline=Book and manage appointments for any business or service
# System type: General, Healthcare, Salon, Consultancy, Education, Other (or set in Admin → System Settings)
app.systemType=General

# Session
session.timeoutMinutes=15
session.warningMinutes=13

# If login fails for admin@admin.com / admin123 after importing SQL, set true once to reset BCrypt hash, then false.
auth.forceDefaultAdminPassword=true

# Business hours (24h format). 8–18 = كل الأوقات المعروضة في قائمة الحجز مقبولة
business.hourStart=8
business.hourEnd=18

# Booking rules
booking.maxDurationMinutes=120
# الحد الأدنى لساعات قبل الموعد (0 = يمكن الحجز حتى قبل الموعد بدقائق)
booking.cutoffHoursBefore=0
# Comma-separated service names shown when booking (rename to match your business)
booking.appointmentTypes=Standard,New session,Return visit,Express,Extended session,Preparation
# 0-based index for "return / follow-up style" booking (maps to follow-up rules in the engine)
booking.followUpTypeIndex=2
# 0-based index for "first structured session" (maps to assessment-style type in the engine)
booking.consultationTypeIndex=1
# First value = remote/online; second = in-person (any labels you prefer)
booking.serviceTypes=Remote,In person
booking.onlineLocationLabel=Remote link (video or phone)
booking.onsiteLocationLabel=Your premises or agreed address

# Database: الربط مع phpMyAdmin (MySQL / MariaDB)
# تأكد من استيراد ملف database/full_schema_mysql_phpmyadmin.sql من phpMyAdmin أولاً
database.enabled=true
database.url=jdbc:mysql://localhost:3306/appointment?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
database.username=root
database.password=

# --- إذا أردت استخدام PostgreSQL (pgAdmin) بدلاً من MySQL، عطّل الأسطر أعلاه وفعّل التالية:
# database.enabled=true
# database.url=jdbc:postgresql://localhost:5432/appointment?currentSchema=appointment
# database.username=appointments_user
# database.password=123456

