sonar.projectKey=moamenishtaya_appointment-system
sonar.organization=moamenishtaya
sonar.host.url=https://sonarcloud.io
sonar.projectName=AppointmentSystem

# Source layout
sonar.sources=src/main/java
sonar.tests=src/test/java

# Java build output and JaCoCo coverage
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Optional exclusions for generated/build files
sonar.exclusions=target/**,**/*.log
